apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lockbox
  namespace: lockbox-system
spec:
  interval: 10m
  chart:
    spec:
      chart: lockbox
      version: "0.1.0-0af4e088"
      sourceRef:
        kind: HelmRepository
        name: lockbox
        namespace: flux-system
  install:
    createNamespace: false
  upgrade:
    cleanupOnFail: true
  values:
    image:
      repo: registry.cherkaoui.ch/hadicherkaoui/lockbox
      # Chart and image both come from commit 0af4e088 — keep the two pins in
      # step. This build reports each secret's namespace, which `lbx reseal`
      # requires before the controller's LOCKBOX_REQUIRE_AAD can be relied on.
      tag: "0af4e08899e0bb9c6edd60cb28f713af7adb3715"
      pullPolicy: IfNotPresent
    auth:
      # SOPS-encrypted Secret defined in secrets/lockbox/lockbox-auth.secret.yaml.
      existingSecret: lockbox-auth
    persistence:
      enabled: true
      size: 1Gi
      # `fast` is the SC used by scolx CNPG — RWO, low-latency, matches
      # SQLite's request profile.
      storageClassName: fast
    ingress:
      enabled: true
      entryPoint: websecure
      host: lockbox.cherkaoui.ch
      middlewares:
        - name: internal-only
          namespace: traefik
        - name: security-headers
          namespace: traefik
      tls:
        enabled: true
        certResolver: letsencrypt
