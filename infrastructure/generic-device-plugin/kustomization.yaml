# No namespace.yaml: the chart hardcodes kube-system for its DaemonSet, and a
# Namespace object for kube-system would hand Flux the power to prune it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease-generic-device-plugin.yaml
