# Hands host devices to unprivileged pods as an extended resource. A hostPath
# mount alone gets EPERM from the device cgroup; the plugin is what adds the
# device to the pod's allow list.
#
# Used by backseat, whose session browsers render WebGL on the iGPU's render
# node. Each session pod asks for one `devic.es/dri`: the device name below
# under the plugin's default domain.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: generic-device-plugin
  # The release namespace, because the ServiceAccount follows it while the
  # DaemonSet is hardcoded to kube-system.
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: generic-device-plugin
      version: "0.2.0"
      sourceRef:
        kind: HelmRepository
        name: squat
        namespace: flux-system
  install:
    createNamespace: false
  values:
    image:
      repository: ghcr.io/squat/generic-device-plugin
      tag: "0.2.0"
      pullPolicy: IfNotPresent
    serviceAccount:
      # The plugin talks to the kubelet over its socket, never to the API.
      automount: false
    deployPodMonitor: false
    # Replaces the chart's default list (serial, video, fuse, audio), none of
    # which anything here uses.
    devices:
      - name: dri
        groups:
          # Units of one shared node, not separate GPUs: this is how many
          # session pods can hold it at once. A session past the count waits
          # in Pending until session_open gives up on it.
          - count: 10
            paths:
              - path: /dev/dri/renderD128
