apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: internal-only
  namespace: traefik
spec:
  # No ipStrategy — DNS is not Cloudflare-proxied and Cilium preserves the
  # source IP for the local Traefik backend, so the remote address is the
  # real client. List this middleware before security-headers so denied
  # requests are cut off before header rewriting.
  ipAllowList:
    sourceRange:
      # Server VLAN, holding the node (172.26.20.250) and the Traefik VIP
      # (172.26.20.16). Includes the router (172.26.20.1), which is the source
      # of NAT-loopback hits originating on this VLAN — that is how LAN
      # clients, in-cluster pods, and tailnet exit-node clients arrive.
      - 172.26.20.0/24
      # Client VLAN. Hits the public IP rather than the VIP, and the router
      # rewrites the source on that loopback, so neither the host address nor
      # the server VLAN's router covers it — the whole /24 has to be listed.
      - 172.26.10.0/24
      # Headscale tailnet. Only the source when a client addresses the LAN
      # VIP (172.26.20.16) directly; public DNS points at the WAN IP, so a
      # plain tailnet client resolving the hostname takes the LAN path above.
      - 100.64.0.0/10
