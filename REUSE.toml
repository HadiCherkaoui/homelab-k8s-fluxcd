version = 1

SPDX-PackageName = "homelab-k8s-fluxcd"
SPDX-PackageSupplier = "Hadi Cherkaoui <contact@hide.cherkaoui.ch>"
SPDX-PackageDownloadLocation = "https://gitlab.cherkaoui.ch/HadiCherkaoui/homelab-k8s-fluxcd"

# Files that cannot carry an inline SPDX header without changing behaviour.
# Everything else is annotated in-file by `reuse annotate`.
#
# Copyright notices carry no year on purpose: REUSE makes it optional, copyright
# attaches automatically under Berne, and a year nobody updates becomes a false
# claim rather than a useful fact. Git history is the record.

# The root LICENSE is a verbatim copy of LICENSES/AGPL-3.0-or-later.txt, kept
# because that is where GitLab and GitHub detect the licence. The text is the
# FSF's, not ours -- `override` stops the 2007 FSF line inside it being reported
# as this file's copyright.
[[annotations]]
path = "LICENSE"
precedence = "override"
SPDX-FileCopyrightText = "2007 Free Software Foundation, Inc. <https://fsf.org/>"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Generated by `flux bootstrap` and rewritten by it on every upgrade -- the file
# says "DO NOT EDIT" in its own header. This is the upstream Flux GitOps
# Toolkit: 13,032 lines of CRDs, Deployments, RBAC and NetworkPolicies for four
# controllers. None of it is ours.
[[annotations]]
path = "clusters/homelab/flux-system/**"
precedence = "override"
SPDX-FileCopyrightText = "The Flux authors"
SPDX-License-Identifier = "Apache-2.0"

# SOPS-encrypted secrets. The sops metadata block carries a MAC over the file;
# these are never edited by hand and are decrypted in-cluster. Nothing is
# inserted into them.
[[annotations]]
path = "**/*.secret.yaml"
SPDX-FileCopyrightText = "Hadi Cherkaoui <contact@hide.cherkaoui.ch>"
SPDX-License-Identifier = "AGPL-3.0-or-later"
