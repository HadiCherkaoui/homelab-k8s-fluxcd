apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle-mcp
  namespace: moodle-mcp
  labels:
    app: moodle-mcp
spec:
  replicas: 1
  # Sessions live in pod memory and the spool is an emptyDir, so a second pod
  # loses sessions and 404s the first one's download links.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moodle-mcp
  template:
    metadata:
      labels:
        app: moodle-mcp
    spec:
      # Private project. Namespaced name because lockbox names are global.
      imagePullSecrets:
        - name: registry-cherkaoui-moodle-mcp
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: moodle-mcp
          # Pinned to a commit, not :latest. With a floating tag the pod spec
          # never changes, so Flux has nothing to reconcile and a newly built
          # image only lands via `kubectl rollout restart` — which Flux then
          # reverts a few minutes later, because the restart annotation is not
          # in git. That reverting restart kills the pod a second time, and MCP
          # sessions live in pod memory, so a connected client loses its session
          # mid-conversation and every call after that fails.
          #
          # Deploying is therefore a commit here: bump this to the app's commit
          # sha (CI publishes one tag per commit) and let Flux do the rollout.
          # It also makes an eviction or node reboot re-pull the same image
          # rather than whatever :latest happens to be by then.
          image: registry.cherkaoui.ch/hadicherkaoui/moodle-mcp:1fd4c8059e5abfb85a32f8eabe2b5f354dea74b4
          # The tag is immutable, so there is nothing to re-pull.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Setting a bind address is what selects HTTP mode over stdio.
            - name: MOODLE_MCP_HTTP_BIND
              value: "0.0.0.0:8080"
            # Must be an origin with no path: the server appends
            # /.well-known/... to this, which only matches RFC 9728 while the
            # path is empty. Hence a host per MCP server rather than subpaths.
            - name: MOODLE_MCP_PUBLIC_URL
              value: https://moodle.mcp.cherkaoui.ch
            # MOODLE_MCP_SPOOL_URL defaults to <public URL>/files.
            - name: MOODLE_MCP_SPOOL_DIR
              value: /var/spool/moodle-mcp
            - name: RUST_LOG
              value: moodle_mcp=info
          envFrom:
            # Moodle credentials + OIDC issuer/audience. Without the issuer the
            # server leaves /mcp open.
            - secretRef:
                name: moodle-mcp
          volumeMounts:
            - name: spool
              mountPath: /var/spool/moodle-mcp
          # Only /mcp is gated, so an uncredentialed probe still gets 200.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          # scratch image: one static binary, and no /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # tmpfs: spooled files live 15 minutes and are unlinked once fetched.
        # sizeLimit is the only bound, since the pod sets no memory limit.
        - name: spool
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
