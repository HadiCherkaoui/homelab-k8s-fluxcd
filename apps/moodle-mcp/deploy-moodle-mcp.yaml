apiVersion: apps/v1
kind: Deployment
metadata:
  name: moodle-mcp
  namespace: moodle-mcp
  labels:
    app: moodle-mcp
spec:
  replicas: 1
  # One pod: sessions live in its memory, the spool is an emptyDir.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: moodle-mcp
  template:
    metadata:
      labels:
        app: moodle-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: moodle-mcp
          # Commit sha, not :latest — a floating tag never changes the pod
          # spec, so Flux has nothing to roll and only a manual restart moves
          # it, which Flux then reverts. Bump this to deploy.
          image: registry.cherkaoui.ch/hadicherkaoui/moodle-mcp:cdae9b006a1f0a59e72583afeec10c21fa0e18cc
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            # Setting a bind address is what selects HTTP mode over stdio.
            - name: MOODLE_MCP_HTTP_BIND
              value: "0.0.0.0:8080"
            # Must be an origin with no path — the server appends
            # /.well-known/... and that only matches RFC 9728 when it is empty.
            - name: MOODLE_MCP_PUBLIC_URL
              value: https://moodle.mcp.cherkaoui.ch
            # MOODLE_MCP_SPOOL_URL defaults to <public URL>/files.
            - name: MOODLE_MCP_SPOOL_DIR
              value: /var/spool/moodle-mcp
            - name: RUST_LOG
              value: moodle_mcp=info
          envFrom:
            # Without MOODLE_MCP_OIDC_ISSUER the server leaves /mcp open.
            - secretRef:
                name: moodle-mcp
          volumeMounts:
            - name: spool
              mountPath: /var/spool/moodle-mcp
          # Only /mcp is gated, so an uncredentialed probe still gets 200.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
          # scratch image: one static binary, and no /tmp.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        # tmpfs: spooled files live 15 minutes and are unlinked once fetched.
        # sizeLimit is the only bound, since the pod sets no memory limit.
        - name: spool
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
