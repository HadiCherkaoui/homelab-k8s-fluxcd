apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: moodle-mcp
  namespace: moodle-mcp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  entryPoints:
    - websecure
  routes:
    # Claude's sandbox egresses outside Anthropic's published range, so the
    # spool cannot sit behind the allowlist. Safe open: 128-bit single-use
    # tokens, 15 minute expiry. GET-only, explicit priority.
    - match: Host(`moodle.mcp.cherkaoui.ch`) && PathPrefix(`/files/`) && Method(`GET`)
      kind: Rule
      priority: 100
      middlewares:
        - name: security-headers
          namespace: traefik
      services:
        - name: moodle-mcp
          port: 8080

    # The inbound half, and open for the same reason: whoever holds the bytes
    # is the sandbox or the user's own browser, neither of which carries a
    # credential or a predictable source address. This one *writes*, so what it
    # will accept is fixed before its token exists — one assignment, one
    # filename, one body under a cap enforced as it streams, once. No GET, so
    # nothing can be read back out of it. Methods are pinned here as well as in
    # the server, since an ingress rule is the cheaper place to be sure.
    - match: Host(`moodle.mcp.cherkaoui.ch`) && PathPrefix(`/uploads/`) && (Method(`PUT`) || Method(`POST`))
      kind: Rule
      priority: 100
      middlewares:
        - name: security-headers
          namespace: traefik
      services:
        - name: moodle-mcp
          port: 8080

    # Everything else. Plain Host rule — the server checks the Host header
    # against MOODLE_MCP_PUBLIC_URL, so no prefix rewriting in front of it.
    - match: Host(`moodle.mcp.cherkaoui.ch`)
      kind: Rule
      priority: 1
      middlewares:
        - name: anthropic-only
          namespace: moodle-mcp
        - name: security-headers
          namespace: traefik
      services:
        - name: moodle-mcp
          port: 8080
  tls:
    certResolver: letsencrypt
