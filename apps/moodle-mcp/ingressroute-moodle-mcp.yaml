apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: moodle-mcp
  namespace: moodle-mcp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  entryPoints:
    - websecure
  routes:
    # Claude's sandbox fetches spool links from different infrastructure than
    # the connector — observed at 34.29.237.63, GCP — so this cannot sit behind
    # the allowlist. Under it, every tool call works while every PDF 403s.
    # Safe open: 128-bit single-use tokens, 15 minute expiry. GET-only so a
    # world-reachable route is not also an exfiltration sink. Priority is
    # explicit so a shorter rewrite cannot reorder it behind the catch-all.
    - match: Host(`moodle.mcp.cherkaoui.ch`) && PathPrefix(`/files/`) && Method(`GET`)
      kind: Rule
      priority: 100
      middlewares:
        - name: security-headers
          namespace: traefik
      services:
        - name: moodle-mcp
          port: 8080

    # Everything else: /mcp, the metadata documents, /health. Plain Host rule —
    # the server checks the Host header against MOODLE_MCP_PUBLIC_URL, so no
    # prefix rewriting can go in front of it.
    - match: Host(`moodle.mcp.cherkaoui.ch`)
      kind: Rule
      priority: 1
      middlewares:
        - name: anthropic-only
          namespace: moodle-mcp
        - name: security-headers
          namespace: traefik
      services:
        - name: moodle-mcp
          port: 8080
  tls:
    certResolver: letsencrypt
