apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: anthropic-only
  namespace: moodle-mcp
spec:
  # OAuth gates /mcp; this removes the rest of the internet. No ipStrategy —
  # DNS is not Cloudflare-proxied, so the remote address is the real client.
  ipAllowList:
    sourceRange:
      # Anthropic's *outbound* range. Not the /23 on the same docs page —
      # that is inbound, and narrowing to it blocks half their egress.
      - 160.79.104.0/21
