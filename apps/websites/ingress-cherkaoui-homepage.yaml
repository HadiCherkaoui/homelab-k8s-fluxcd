apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: cherkaoui-homepage
  namespace: websites
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`cherkaoui.ch`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        # Was security-headers-webhook, whose only difference is
        # `connect-src https://discord.com` — needed back when the browser
        # posted the enquiry to Discord itself. It now posts to /api/anfrage
        # on this origin, so 'self' covers it and the exemption would only
        # widen where an injected script could exfiltrate to.
        # (ingress-hadi still uses the webhook variant; the portfolio has not
        # made the same move yet.)
        - name: security-headers
          namespace: websites
      services:
        - name: cherkaoui-homepage
          port: 3000
  tls:
    certResolver: letsencrypt
