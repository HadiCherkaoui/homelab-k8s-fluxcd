apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nitter
  namespace: nitter
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  entryPoints:
    - websecure
  routes:
    # Two routes on one host: the higher priority one matches internal clients
    # and skips the password, so only requests arriving from outside are
    # challenged. Priorities are explicit because Traefik otherwise orders
    # rules by length, which would silently reorder if either rule is edited.
    - match: Host(`nitter.cherkaoui.ch`) && (ClientIP(`172.26.20.0/24`) || ClientIP(`172.26.10.0/24`) || ClientIP(`100.64.0.0/10`))
      kind: Rule
      priority: 20
      middlewares:
        - name: security-headers
          namespace: traefik
      services:
        - name: nitter
          port: 8080
    # Everyone else. The password is what keeps crawlers off the instance —
    # they find the hostname in certificate transparency logs within hours,
    # and unauthenticated traffic would spend the session pool's rate limit
    # and get the backing X account suspended.
    - match: Host(`nitter.cherkaoui.ch`)
      kind: Rule
      priority: 10
      middlewares:
        - name: basic-auth
          namespace: nitter
        - name: security-headers
          namespace: traefik
      services:
        - name: nitter
          port: 8080
  tls:
    certResolver: letsencrypt
